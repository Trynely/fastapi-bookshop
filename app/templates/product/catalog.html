{% extends "base.html" %}

{% block title %}Каталог{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">Каталог книг</h1>

    <div class="tabs" role="tablist">
        <button class="tab active" data-by="new">🆕 Новинки</button>
        <button class="tab" data-by="popular">🔥 Популярные</button>
    </div>

    <div class="book-grid" id="books-grid"></div>

    <div class="scroll-sentinel" id="load-more"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const grid = document.getElementById("books-grid");
    const sentinel = document.getElementById("load-more");
    let by = "new";

    /* "new" → id_cursor, "popular" → encoded_cursor (см. BookFilterQH) */
    const pager = createCursorPager({
        sentinel,
        async fetchPage(cursor) {
            const params = new URLSearchParams({ by });
            if (cursor !== null && cursor !== undefined) {
                params.set(by === "new" ? "id_cursor" : "encoded_cursor", cursor);
            }
            const data = await apiFetch(`/books?${params}`);
            return { items: data.books, next: data.next, hasNext: data.has_next };
        },
        render(items, isFirst) {
            if (isFirst) grid.innerHTML = "";
            if (isFirst && !items.length) {
                grid.innerHTML = emptyState("🔍", "Ничего не найдено");
                return;
            }
            grid.insertAdjacentHTML("beforeend", items.map(bookCard).join(""));
        },
    });

    function load() {
        showSkeletons(grid, 8);
        pager.reset();
        pager.loadNext().then(() => {
            // скелетоны заменяются в render(isFirst)
        });
    }

    document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
            document.querySelector(".tab.active")?.classList.remove("active");
            tab.classList.add("active");
            by = tab.dataset.by;
            load();
        });
    });

    load();
})();
</script>
{% endblock %}
