{% extends "base.html" %}

{% block title %}Поддержка{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">💬 Чат поддержки</h1>

    <div class="chat-shell">
        <div class="chat-head">
            Поддержка Bookshop
            <span class="chat-status off" id="ws-status">офлайн</span>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input-row">
            <input class="form-input" id="chat-input" placeholder="Напишите сообщение…" maxlength="1000">
            <button class="btn" id="chat-send">Отправить</button>
            <button class="btn btn-ghost" id="chat-close" title="Закрыть чат">Закрыть</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async () => {
    const token = await requireAuth();
    if (!token) return;

    const body = document.getElementById("chat-body");
    const input = document.getElementById("chat-input");
    const statusEl = document.getElementById("ws-status");
    let ws = null;

    const scroll = () => { body.scrollTop = body.scrollHeight; };

    function addMsg({ sender, content }, { system = false } = {}) {
        const el = document.createElement("div");
        if (system) {
            el.className = "msg msg-system";
            el.textContent = content;
        } else {
            const mine = sender === "user";
            el.className = `msg ${mine ? "msg-user" : "msg-other"}`;
            if (!mine) {
                const label = { bot: "🤖 Бот", manager: "👤 Оператор" }[sender] ?? sender;
                el.innerHTML = `<div class="msg-sender">${esc(label)}</div>`;
            }
            el.appendChild(document.createTextNode(content));
        }
        body.appendChild(el);
        scroll();
    }

    function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}${API}/support/ws?token=${encodeURIComponent(getToken())}`);

        ws.onopen = () => {
            statusEl.textContent = "онлайн";
            statusEl.className = "chat-status on";
        };

        ws.onmessage = (e) => {
            let payload;
            try { payload = JSON.parse(e.data); } catch { return; }

            switch (payload.type) {
                case "history":
                    body.innerHTML = "";
                    (payload.data?.messages ?? []).forEach((m) => addMsg(m));
                    if (!body.children.length) {
                        addMsg({ content: "Напишите нам — бот ответит мгновенно, а при необходимости подключится оператор." }, { system: true });
                    }
                    break;
                case "message":
                    addMsg(payload.data ?? {});
                    break;
                case "system":
                    addMsg({ content: String(payload.data ?? "") }, { system: true });
                    break;
                case "error":
                    toast(String(payload.data ?? "Ошибка чата"), "error");
                    break;
            }
        };

        ws.onclose = (e) => {
            statusEl.textContent = e.reason ? `офлайн — ${e.reason}` : "офлайн";
            statusEl.className = "chat-status off";
        };
    }

    function send() {
        const text = input.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(text);
        input.value = "";
    }

    document.getElementById("chat-send").addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    document.getElementById("chat-close").addEventListener("click", () => {
        if (ws?.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: "close" }));
            addMsg({ content: "Чат закрыт" }, { system: true });
        }
    });

    connect();
})();
</script>
{% endblock %}
