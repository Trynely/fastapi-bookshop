{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container" style="max-width:440px;">
    <div class="card">
        <div class="tabs" id="auth-tabs">
            <button class="tab active" data-mode="login">Вход</button>
            <button class="tab" data-mode="register">Регистрация</button>
        </div>

        <!-- шаг 1: креды -->
        <form id="creds-form" novalidate>
            <div class="form-group" id="username-group" hidden>
                <label class="form-label" for="username">Имя пользователя</label>
                <input class="form-input" id="username" autocomplete="username" minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" id="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-input" id="password" type="password" autocomplete="current-password" required>
                <div class="form-hint">Минимум 8 символов: заглавная, строчная, цифра и спецсимвол</div>
            </div>
            <div class="form-error" id="creds-error"></div>
            <button class="btn btn-block" type="submit" id="creds-submit" style="margin-top:.5rem;">Продолжить</button>
        </form>

        <!-- шаг 2: otp -->
        <form id="otp-form" hidden novalidate>
            <p style="margin-bottom:1rem;">Мы отправили код подтверждения на <strong id="otp-email"></strong></p>
            <div class="form-group">
                <label class="form-label" for="otp">Код из письма</label>
                <input class="form-input" id="otp" inputmode="numeric" autocomplete="one-time-code" required
                       style="letter-spacing:.4em;text-align:center;font-size:1.2rem;">
            </div>
            <div class="form-error" id="otp-error"></div>
            <button class="btn btn-block" type="submit" style="margin-top:.5rem;">Подтвердить</button>
            <button class="btn btn-ghost btn-block" type="button" id="otp-back" style="margin-top:.5rem;">← Назад</button>
        </form>

        <div style="text-align:center;margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1.25rem;">
            <a class="btn btn-outline btn-block" id="google-login" href="#">
                Войти через Google
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const next = new URLSearchParams(location.search).get("next") || "/";
    let mode = "login";       // login | register
    let sessionId = null;

    document.getElementById("google-login").href = `${API}/users/oauth/google/login`;

    /* переключение вкладок */
    document.querySelectorAll("#auth-tabs .tab").forEach((tab) => {
        tab.addEventListener("click", () => {
            document.querySelector("#auth-tabs .active")?.classList.remove("active");
            tab.classList.add("active");
            mode = tab.dataset.mode;
            document.getElementById("username-group").hidden = mode !== "register";
            document.getElementById("creds-error").textContent = "";
        });
    });

    /* шаг 1: логин/регистрация → отправка OTP */
    document.getElementById("creds-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("creds-error");
        errorEl.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const body = mode === "register"
            ? { email, password, username: document.getElementById("username").value.trim() }
            : { email, password };

        const btn = document.getElementById("creds-submit");
        btn.disabled = true;
        try {
            const data = await apiFetch(`/users/${mode}`, { method: "POST", json: body });
            sessionId = data.session_id;
            document.getElementById("otp-email").textContent = email;
            document.getElementById("creds-form").hidden = true;
            document.getElementById("otp-form").hidden = false;
            document.getElementById("otp").focus();
        } catch (err) {
            errorEl.textContent = typeof err.detail === "string" ? err.detail : err.message;
        } finally {
            btn.disabled = false;
        }
    });

    /* шаг 2: подтверждение OTP → access token */
    document.getElementById("otp-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("otp-error");
        errorEl.textContent = "";

        try {
            const data = await apiFetch(`/users/${mode}/verify`, {
                method: "POST",
                json: {
                    session_id: sessionId,
                    otp: document.getElementById("otp").value.trim(),
                },
            });
            setToken(data.access_token);
            toast("Добро пожаловать!", "success");
            location.href = next;
        } catch (err) {
            errorEl.textContent = typeof err.detail === "string" ? err.detail : err.message;
        }
    });

    document.getElementById("otp-back").addEventListener("click", () => {
        document.getElementById("otp-form").hidden = true;
        document.getElementById("creds-form").hidden = false;
    });
})();
</script>
{% endblock %}
