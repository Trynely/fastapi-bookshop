{% extends "base.html" %}

{% block title %}ИИ Консультант{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">🤖 ИИ Консультант</h1>

    <div class="chat-shell">
        <div class="chat-head">
            Консультант по книгам
            <span class="chat-status" id="agent-status"></span>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="msg msg-system">Спросите совета — например: «посоветуй фантастику на вечер»</div>
        </div>
        <div class="chat-input-row">
            <input class="form-input" id="chat-input" placeholder="Ваш вопрос…" maxlength="2000">
            <button class="btn" id="chat-send">Отправить</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async () => {
    if (!await requireAuth()) return;

    const body = document.getElementById("chat-body");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send");
    const statusEl = document.getElementById("agent-status");

    const scroll = () => { body.scrollTop = body.scrollHeight; };

    function addMsg(cls, text = "") {
        const el = document.createElement("div");
        el.className = `msg ${cls}`;
        el.textContent = text;
        body.appendChild(el);
        scroll();
        return el;
    }

    /* разбор text/event-stream из fetch-стрима */
    async function streamChat(message, onEvent) {
        const res = await fetch(`${API}/agent/chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${getToken()}`,
            },
            credentials: "include",
            body: JSON.stringify({ message }),
        });

        if (!res.ok) {
            let detail = res.statusText;
            try { detail = (await res.json()).detail ?? detail; } catch { /* ignore */ }
            throw new Error(detail);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        /* SSE-спека: после "event:"/"data:" убирается ровно один пробел */
        const clean = (s) => s.startsWith(" ") ? s.slice(1) : s;

        for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            // sse_starlette разделяет строки через \r\n — нормализуем
            buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");

            let idx;
            while ((idx = buffer.indexOf("\n\n")) !== -1) {
                const raw = buffer.slice(0, idx);
                buffer = buffer.slice(idx + 2);

                let event = "message";
                const dataLines = [];
                for (const line of raw.split("\n")) {
                    if (line.startsWith("event:")) event = clean(line.slice(6));
                    else if (line.startsWith("data:")) dataLines.push(clean(line.slice(5)));
                }
                onEvent(event, dataLines.join("\n"));
            }
        }
    }

    async function send() {
        const text = input.value.trim();
        if (!text || sendBtn.disabled) return;

        addMsg("msg-user", text);
        input.value = "";
        sendBtn.disabled = true;
        statusEl.textContent = "думает…";
        statusEl.className = "chat-status on";

        const answer = addMsg("msg-other", "…");
        let acc = "";

        try {
            const asJson = (s) => { try { return JSON.parse(s); } catch { return null; } };

            await streamChat(text, (event, data) => {
                if (event === "token") {
                    acc += data;
                    answer.textContent = acc;
                    scroll();
                } else if (event === "tool") {
                    const name = asJson(data)?.name;
                    statusEl.textContent = name ? `🔧 ${name}` : "🔧 использует инструмент…";
                } else if (event === "done") {
                    const full = asJson(data)?.answer;
                    if (full) answer.textContent = full;
                } else if (event === "error") {
                    answer.textContent = asJson(data)?.message ?? `Ошибка: ${data}`;
                }
            });
        } catch (e) {
            answer.textContent = `Ошибка: ${e.message}`;
        } finally {
            sendBtn.disabled = false;
            statusEl.textContent = "";
            scroll();
        }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
})();
</script>
{% endblock %}
