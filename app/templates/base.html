<!DOCTYPE html>
<html lang="ru" data-api-prefix="{{ api_prefix }}"{% block html_attrs %}{% endblock %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookshop{% endblock %} · Bookshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="nav-content">
            <a href="/" class="logo">📚 Bookshop</a>
            <div class="nav-links">
                <a href="/books">Каталог</a>
                <a href="/cart">Корзина</a>
                <a href="/wishlist">Избранное</a>
            </div>
            <div id="nav-auth"></div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>© Bookshop — учебный проект на FastAPI</span>
            <span><a href="/docs">API Docs</a> · <a href="/admin/">Админка</a></span>
        </div>
    </footer>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script src="{{ url_for('static', path='/js/chat-widget.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
